
services:
  mysql:
    image: mysql:8.4
    container_name: mysql-practice
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: sql_practice
      MYSQL_USER: student
      MYSQL_PASSWORD: student123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./exercises:/exercises

volumes:
  mysql_data: